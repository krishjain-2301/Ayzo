[project]
name = "ayzo-api"
version = "0.1.0"
description = "AYZO - local red teaming for LLM apps (API)"
requires-python = ">=3.12"
dependencies = [
    # ---- Web Framework ----
    "fastapi>=0.115.0",          # The API framework (handles HTTP requests)
    "uvicorn[standard]>=0.32.0", # ASGI server (actually runs the FastAPI app)
    # ---- Database ----
    "sqlalchemy[asyncio]>=2.0.0", # ORM - interact with SQLite using Python objects
    "aiosqlite>=0.20.0",          # Async SQLite driver (zero-setup local database)
    # ---- Uploads ----
    "python-multipart>=0.0.9",    # Form data parsing (folder upload)
    "cryptography>=42.0.0",       # Encrypts stored API keys and target headers
    # ---- AI / LLM ----
    "litellm>=1.50.0",            # Unified API for ALL LLMs (Ollama, Groq, OpenAI, etc.)
    "httpx>=0.28.0",              # Async HTTP client (for attacking target apps)
    # ---- Data & Validation ----
    "pydantic>=2.10.0",           # Data validation & serialization
    "pydantic-settings>=2.6.0",   # Load settings from .env files
    "pyyaml>=6.0",                # Parse YAML attack payload files
    # ---- Utilities ----
    "python-dotenv>=1.0.0",       # Load .env files
]

[project.scripts]
ayzo = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",               # Python linter + formatter (replaces black + flake8)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

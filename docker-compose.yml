# ==================================================
# AYZO — Local Docker Infrastructure
# ==================================================
# This is OPTIONAL. AYZO runs on SQLite by default
# with zero setup. Use this only if you want to
# switch to PostgreSQL for larger datasets.
#
# Run with: docker-compose up -d
# Stop with: docker-compose down
# ==================================================

services:
  # ------------------------------------------------
  # PostgreSQL (optional — SQLite is the default)
  # ------------------------------------------------
  # To use: set DATABASE_URL in .env to:
  # postgresql+asyncpg://ayzo:ayzo@localhost:5432/ayzo
  postgres:
    image: postgres:16-alpine
    container_name: ayzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayzo
      POSTGRES_PASSWORD: ayzo
      POSTGRES_DB: ayzo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayzo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

name: Keep Render API Alive

# This workflow pings the Render backend every 14 minutes to prevent it from going to sleep on the Free tier.
on:
  schedule:
    # Runs every 14 minutes
    - cron: "*/14 * * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        run: curl -s -o /dev/null -w "%{http_code}" https://ayzo-api-k11a.onrender.com/health
